[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-triage-env"
version = "1.1.0"
description = "A deterministic SRE triage benchmark for evaluating tool-using AI agents"
requires-python = ">=3.10"
dependencies = [
    "openenv-core",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.30", "litellm>=1.0.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
sre-triage-server = "sre_triage.api.app:main"
sre-triage-benchmark = "sre_triage.benchmark.inference:main"
server = "sre_triage.api.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
