spec_version: 1
name: sre_mern_triage
environment_id: sre_mern_triage
description: >
  A deterministic SRE triage benchmark for tool-using AI agents.
  Agents diagnose and resolve infrastructure incidents across multiple
  deterministic scenarios using shell commands and config changes.
docker_image: sre-mern-env:latest

tasks:
  - id: easy_node_down
    difficulty: easy
    description: Node.js service is stopped. Agent must start the PM2 process.
  - id: medium_config_drift
    difficulty: medium
    description: MongoDB port mismatch in .env config. Agent must fix the port and restart.
  - id: hard_hybrid_failure
    difficulty: hard
    description: Port mismatch plus a rogue high-CPU process causing gateway timeouts.
  - id: hard_bad_secret
    difficulty: hard
    description: JWT secret drift causes authentication failures until the secret is corrected and the service restarts.
  - id: hard_disk_pressure
    difficulty: hard
    description: Disk pressure from oversized logs causes write failures until logs are rotated.

action_space:
  type: json
  actions:
    - execute_command
    - write_file
    - check_health

observation_space:
  fields:
    - stdout
    - stderr
    - exit_code
    - current_directory
    - system_health_check
    - reward
    - done

resource_limits:
  vcpu: 2
  memory_gb: 8
  max_runtime_minutes: 20